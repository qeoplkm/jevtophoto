<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const labelOf = (qk, k) => { const q = D.questions[qk]; return q.type === 'score' ? q.criteria[Number(k)] : k; };
  const descOf = (qk, k) => { const q = D.questions[qk]; return q.type === 'score' ? q.criteria[Number(k)] : `${k}：${q.criteria[k]}`; };
  const keysOf = (qk) => { const q = D.questions[qk]; return q.type === 'score' ? q.criteria.map((_, i) => String(i)) : Object.keys(q.criteria); };
  const f2 = (v) => (Number.isFinite(v) ? v.toFixed(2) : '–');
  const dz = { delete: '删', unsure: '说不准', keep: '留' };
  const colZh = { delete: '建议删除', unsure: '拿不准', keep: '保留' };
  const nEdge = D.recs.filter((r) => r.edge).length;

  $('#meta').textContent = `${D.model} · ${D.ranAt.slice(0, 16).replace('T', ' ')} UTC · ${D.recs.length} 条记录（${nEdge} 条边界）× 3 问 × ${D.reps} 次`;

  const acc = (qk) => D.accTable.find((a) => a.qk === qk);
  const cards = [
    ['junk 清晰案例', `${acc('junk').clear.ok}/${acc('junk').clear.n}`, '按次算，众数 ∈ 标准答案'],
    ['junk 边界案例', `${acc('junk').edge.ok}/${acc('junk').edge.n}`, '标准答案已放宽成集合'],
    ['kind', `${acc('kind').all.ok}/${acc('kind').all.n}`, '全部记录按次算'],
        ['utility 基线 vs 端到端', `错 ${D.cmp.utility.wrong} : ${D.cmp.pipeline.wrong}`, `伤害 ${D.cmp.utility.harm} : ${D.cmp.pipeline.harm} · 漏网 ${D.cmp.utility.miss} : ${D.cmp.pipeline.miss}`],
    ['端到端（规则 + Jev，门 ' + D.tau + '）', `删 ${D.pipe.del} · 拿不准 ${D.pipe.unsure} · 留 ${D.pipe.keep}`, `伤害 ${D.pipe.harm} · 漏网 ${D.pipe.miss} · 规则定 ${D.pipe.byRule} 条，Jev 定 ${D.pipe.byJev} 条`],
  ];
  $('#cards').innerHTML = cards.map(([k, v, d]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div></div>`).join('');

  $('#gates').innerHTML = `<tr><th>τ</th><th>建议删除</th><th>拿不准</th><th>保留</th><th>伤害</th><th>清晰垃圾被抓到</th><th>边界进了拿不准</th><th>清晰误进拿不准</th><th>保留栏里不该留的</th></tr>`
    + D.gates.map((g) => `<tr><td>${g.tau}</td><td>${g.del}</td><td>${g.unsure}</td><td>${g.keep}</td><td class="${g.harm ? 'bad' : 'ok'}">${g.harm}</td><td>${g.junkCaught}/${g.junkTotal}</td><td>${g.edgeUnsure}/${g.edgeTotal}</td><td>${g.clearUnsure}/${g.clearTotal}</td><td>${g.keepWrong}</td></tr>`).join('');

  const fCat = $('#fCat');
  for (const [k, v] of Object.entries(D.cats)) if (D.recs.some((r) => r.cat === k)) fCat.append(new Option(v, k));

  const bars = (qk, q) => keysOf(qk).map((k) => {
    const p = q.avgDist[k] ?? 0, exp = q.expect.includes(k);
    return `<div class="l ${exp ? 'exp' : ''}" title="${esc(descOf(qk, k))}">${esc(labelOf(qk, k))}</div><div class="track"><div class="fill ${exp ? 'exp' : ''}" style="width:${(p * 100).toFixed(1)}%"></div></div><div class="p ${k === q.maj ? 'top' : ''}">${p.toFixed(2)}</div>`;
  }).join('');
  const qcell = (qk, q) => `<div class="qhead"><span class="${q.majCorrect ? 'ok' : 'bad'}" title="${esc(descOf(qk, q.maj))}">${q.majCorrect ? '✓' : '✗'} ${esc(labelOf(qk, q.maj))}</span><span class="m">${q.correctRuns}/${q.runs.length} 对 · 置信 ${f2(q.conf)}${q.flips ? ` · <span class="warn">翻 ${q.flips}</span>` : ''}</span></div><div class="bars">${bars(qk, q)}</div>`;

  const summ = (s) => { const a = s.asset, r = s.resource, t = s.imageProperties.TIFF, v = s.vision, d = s.derived;
    const bits = [a.mediaType === 'video' ? `video ${a.duration}s` : null, ...a.mediaSubtypes, a.playbackStyle === 'imageAnimated' ? 'GIF' : null, r.contentType.replace(/^(public\.|com\.apple\.|com\.compuserve\.)/, ''), `${a.pixelWidth}×${a.pixelHeight}`,
      t.Model ?? '无 EXIF', a.sourceType === 'typeCloudShared' ? '共享相簿' : null, `脸 ${v.faceCount}`, `字 ${v.recognizedTextCharCount}`, v.barcodeCount ? `码 ${v.barcodeCount}` : null, d.ocrDocType !== 'none' ? d.ocrDocType : null, v.aesthetics.isUtility ? 'utility' : null,
      `美 ${v.aesthetics.overallScore}`, `清 ${d.sharpness}`, `亮 ${d.meanLuminance}`, `${d.daysSinceCreation}d${d.daysSinceAdded !== d.daysSinceCreation ? `（进相册 ${d.daysSinceAdded}d）` : ''}`,
      d.exactDuplicateCount ? `副本 ${d.exactDuplicateCount}` : null, d.nearDuplicateCount ? `近重复 ${d.nearDuplicateCount}` : null, d.isSharpestInBurst === false ? '非最清晰' : d.isSharpestInBurst === true ? '最清晰' : null,
      a.burstIdentifier ? `连拍${a.burstSelectionTypes.length ? ' ' + a.burstSelectionTypes.join('+') : ''}` : null, a.isFavorite ? '★' : null, a.adjustmentsState !== 'none' ? a.adjustmentsState : null, a.extendedMetadata ? 'caption!' : null];
    return bits.filter((b) => b != null).join(' · '); };

  function render() {
    const cat = fCat.value, onlyEdge = $('#fEdge').checked, onlyWrong = $('#fWrong').checked, onlyFlip = $('#fFlip').checked, onlyDis = $('#fDis').checked;
    const rows = D.recs.filter((r) => (!cat || r.cat === cat) && (!onlyEdge || r.edge) && (!onlyWrong || D.qkeys.some((qk) => r.q[qk].correctRuns < r.q[qk].runs.length))
      && (!onlyFlip || D.qkeys.some((qk) => r.q[qk].flips > 0)) && (!onlyDis || r.baseline.utility.decision !== r.jevDecision));
    $('#count').textContent = `${rows.length} 条`;
    $('#rows').innerHTML = `<tr><th>记录</th><th>junk · 该不该删</th><th>kind</th><th>keep</th><th>端到端 vs 基线</th></tr>` + rows.map((r) => {
      const gold = r.gold.map((d) => dz[d]).join('|');
      const dec = (d, name) => `<div><span class="note">${name}</span> <span class="${r.gold.includes(d) ? 'ok' : 'bad'}">${dz[d]}</span></div>`;
      return `<tr><td style="max-width:280px"><div class="id">${esc(r.id)}</div><div style="margin:3px 0"><span class="chip">${esc(D.cats[r.cat])}</span> ${r.edge ? '<span class="chip edge">边界</span>' : ''}</div>${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}<div class="note" style="margin-top:4px">${esc(summ(r.state))}</div><details><summary>state</summary><pre>${esc(JSON.stringify(r.state, null, 1))}</pre></details></td>`
        + D.qkeys.map((qk) => `<td>${qcell(qk, r.q[qk])}</td>`).join('')
        + `<td><div><span class="note">标准</span> ${esc(gold)}</div><div><span class="note">端到端</span> <span class="${r.pipe.column === 'unsure' ? 'warn' : r.gold.includes(r.pipe.column) ? 'ok' : 'bad'}">${esc(colZh[r.pipe.column])}</span> <span class="note">${r.pipe.by === 'rule' ? '规则' : 'Jev'}：${esc(r.pipe.reason)}</span></div>${dec(r.jevDecision, 'Jev 单独')}${dec(r.baseline.utility.decision, 'utility 基线')}</td></tr>`;
    }).join('');
  }
  for (const id of ['fCat', 'fEdge', 'fWrong', 'fFlip', 'fDis']) document.getElementById(id).addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
