# xcodegen generate  →  JevPhoto.xcodeproj (the project file is not committed; regenerate it any time)
name: JevPhoto
options:
  bundleIdPrefix: com.example   # placeholder: change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # from the environment: DEVELOPMENT_TEAM=<your team ID> xcodegen generate
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  JevPhoto:
    type: application
    platform: iOS
    sources:
      - path: JevPhoto
    info:
      path: JevPhoto/Info.plist
      properties:
        CFBundleDisplayName: JevPhoto
        NSPhotoLibraryUsageDescription: Reads your photo library to extract features on this phone for Jev to judge. It never deletes or changes any photo.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jevphoto   # placeholder: change to your own
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
