# xcodegen generate  →  JevPhoto.xcodeproj (the project file is not committed; regenerate it any time)
name: JevPhoto
options:
  bundleIdPrefix: com.yaoshuai
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 54H5XL9Q5A
    CODE_SIGN_STYLE: Automatic   # set DEVELOPMENT_TEAM above and bundleIdPrefix to your own
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  JevPhoto:
    type: application
    platform: iOS
    sources:
      - path: JevPhoto
    info:
      path: JevPhoto/Info.plist
      properties:
        CFBundleDisplayName: JevPhoto
        NSPhotoLibraryUsageDescription: Reads your photo library to extract features on this phone for Jev to judge. It never deletes or changes any photo.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yaoshuai.jevphoto
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
